appId: com.mnemo.app
productName: Mnemo
directories:
  output: out
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true

# v1 ships unsigned everywhere (decision 2026-05-07). The signing plumbing
# stays armed: when CSC_LINK + APPLE_ID secrets appear in CI, the afterSign
# notarize hook activates automatically and `hardenedRuntime` should be
# flipped back to `true` (its required value under a real Developer ID).
#
# Why hardenedRuntime: false today — under an ad-hoc signature (no real
# cert), hardenedRuntime triggers kernel-side JIT prohibition and the
# renderer process is killed at startup. Off is the only safe value for
# unsigned builds.
afterSign: build/notarize.cjs
afterPack: build/fuses.cjs

publish:
  provider: github
  owner: yarikleto
  repo: mnemo
  releaseType: release

mac:
  category: public.app-category.education
  icon: assets/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  # entitlements are inert without hardenedRuntime; kept here so flipping
  # to a signed posture is a single-line change.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false  # we drive @electron/notarize from afterSign so we control logging
  target:
    - target: dmg
      arch:
        - arm64
        - x64
        - universal
    - target: zip
      arch:
        - arm64
        - x64
        - universal

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: assets/icon.png
  category: Education
  maintainer: yarikleto <alfimois@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
